[vram]
reserve_gb=3
dynamic_vram=1
; 0 = synchronous model loading (stable), 1 = async offload
async_offload=0
vram_headroom=2

[comfy]
turbo_lora=
; Empty = default diffusion model from code
diffusion_model=
; comfy_dir not set = ./ComfyUI-Easy-Install next to the program

[llm]
custom_mmproj_path=
custom_model_path=
repeat_penalty=1
frequency_penalty=0
presence_penalty=0
min_p=0.05
top_k=40
top_p=0.95
temperature=0.7
sampling_override=0
kv_cache=q4_0
video_vision=0
model=Qwen3.5-9B-Q4_K_M.gguf
max_output_tokens=4096
context_size=25600
device=auto

[ui]
sound_on=1

[stt]
dir=
threads=0
language=en
model=
enabled=1

[upscale]
enabled=1
port=7890

[models]
extra_paths=[]

[video]
codec=h264
crf=12
nvenc_bitrate=16
